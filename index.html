<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายการออเดอร์ Real-time</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172033;font-family:Arial,"Noto Sans Thai",sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.status{padding:7px 10px;border-radius:99px;background:#e9f8ef;color:#13733c;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f4f6ff;border-radius:14px;padding:14px}.stat b{display:block;font-size:27px;margin-top:5px}.tools{display:grid;grid-template-columns:1fr 180px;gap:10px}input,button{font-size:16px;padding:12px;border-radius:11px}input{width:100%;border:2px solid #dfe4ef}button{border:0;background:#5b68ff;color:#fff;font-weight:800;cursor:pointer}.muted{color:#78849a;font-size:14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}th{background:#f8f9fc}.tag{display:inline-block;background:#eef0ff;border-radius:8px;padding:4px 7px;margin:2px}#drop{border:2px dashed #b8c0d0;border-radius:14px;padding:22px;text-align:center;margin-top:10px}#drop.drag{border-color:#5b68ff;background:#f1f3ff}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="card"><div class="top"><div><h1 style="margin:0">📋 รายการออเดอร์ Real-time</h1><div class="muted">เว็บแยกจากระบบแพ็กสินค้าเดิม</div></div><span id="status" class="status">กำลังเชื่อมต่อ…</span></div></div><div class="card"><h2>📥 นำเข้าไฟล์ออเดอร์</h2><input id="file" type="file" accept=".csv,.xlsx,.xls"><div id="drop">ลากไฟล์ CSV / Excel มาวางที่นี่<br><small class="muted">ระบบจะแยก เลขออเดอร์ • เลขพัสดุ • รายการข้าว • จำนวน • น้ำหนัก ให้ทันที</small></div><div id="importMsg" style="margin-top:10px"></div></div><div class="card"><h2>📊 สรุป</h2><div class="stats"><div class="stat">📦 ออเดอร์<b id="orders">0</b></div><div class="stat">🍚 แพ็กทั้งหมด<b id="packs">0</b></div><div class="stat">⚖️ น้ำหนักรวม<b id="kg">0.00 กก.</b></div></div></div><div class="card"><h2>🔎 ค้นหา</h2><div class="tools"><input id="q" placeholder="เลขออเดอร์ / เลขพัสดุ / ชื่อข้าว"><button id="clear">ล้างการค้นหา</button></div></div><div class="card"><h2>📋 รายการ</h2><div id="table" class="tablewrap"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>const SB_URL="https://leznuprnfzrlgzcuskfb.supabase.co",SB_KEY="sb_publishable_U0dXOgS4xoGKlqEmtTrLuLg_cOt07HLR",db=supabase.createClient(SB_URL,SB_KEY);let rows=[],sub;function today(){return new Date().toISOString().slice(0,10)}function num(v){if(v===null||v===undefined||v==="")return 0;return parseFloat(String(v).replace(/,/g,"").replace(/[^\d.-]/g,""))||0}function pick(o,words){let ks=Object.keys(o),k=ks.find(x=>words.some(w=>x.toLowerCase().replace(/\s/g,"").includes(w)));return k?o[k]:""}function guessKg(s){let x=s.match(/(\d+(?:\.\d+)?)\s*(?:กก|kg|กิโล)/i);if(x)return +x[1];let g=s.match(/(\d+)\s*(?:กรัม|g)/i);return g?+g[1]/1000:1}function normalize(o){let order=String(pick(o,["เลขที่คำสั่งซื้อ","เลขออเดอร์","orderid","orderno","order id","order no","หมายเลขคำสั่งซื้อ"])||"").trim(),track=String(pick(o,["เลขพัสดุ","tracking","trackingno","tracking number","เลขแทร็ค"])||"").trim(),product=String(pick(o,["ชื่อสินค้า","รายการสินค้า","productname","product","สินค้า","ชื่อ"])||"").trim(),qty=num(pick(o,["จำนวน","qty","quantity"])),kg=num(pick(o,["น้ำหนักต่อหน่วย","หน่วยกิโล","unitkg","น้ำหนัก/หน่วย"]));if(!kg){let w=num(pick(o,["น้ำหนัก","weight","กิโล"]));kg=w&&qty?w/qty:w}let d=String(pick(o,["วันที่","orderdate","order date","วันที่สั่งซื้อ"])||today()).slice(0,10);return{order_no:order,tracking_no:track,product_name:product,qty:qty||1,unit_kg:kg||guessKg(product),order_date:d}}async function load(){let{data,error}=await db.from("order_items").select("*").order("imported_at",{ascending:false}).limit(5000);if(error){status.textContent="เชื่อมต่อไม่ได้";status.style.background="#ffecec";status.style.color="#b3261e";return}rows=data||[];render();status.textContent="● Real-time พร้อม";if(!sub)sub=db.channel("order_items_rt").on("postgres_changes",{event:"*",schema:"public",table:"order_items"},()=>load()).subscribe()}async function importFile(file){let buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(ws,{defval:""}),mapped=raw.map(normalize).filter(x=>x.order_no&&x.product_name);if(!mapped.length){importMsg.innerHTML='<span style="color:#b3261e">ไม่พบคอลัมน์ที่จำเป็น เช่น เลขออเดอร์ และชื่อสินค้า</span>';return}let{error}=await db.from("order_items").upsert(mapped,{onConflict:"order_no,tracking_no,product_name"});importMsg.innerHTML=error?'<span style="color:#b3261e">นำเข้าไม่สำเร็จ: '+error.message+'</span>':'<b style="color:#13733c">✅ นำเข้าสำเร็จ '+mapped.length+' รายการ และเครื่องอื่นจะเห็นข้อมูลแบบ Real-time</b>'}function render(){let q=document.getElementById("q").value.toLowerCase().trim(),f=rows.filter(r=>(r.order_no+" "+r.tracking_no+" "+r.product_name).toLowerCase().includes(q)),os=new Set(f.map(x=>x.order_no)),packs=0,kg=0;f.forEach(x=>{packs+=+x.qty||0;kg+=(+x.qty||0)*(+x.unit_kg||0)});orders.textContent=os.size;document.getElementById("packs").textContent=packs;document.getElementById("kg").textContent=kg.toFixed(2)+" กก.";let g={};f.forEach(r=>(g[r.order_no]??=[]).push(r));table.innerHTML=Object.keys(g).length?`<table><thead><tr><th>เลขออเดอร์</th><th>เลขพัสดุ</th><th>รายการข้าว</th><th>แพ็ก</th><th>กก.</th></tr></thead><tbody>`+Object.values(g).map(items=>{let p=0,k=0;items.forEach(i=>{p+=+i.qty;k+=(+i.qty)*(+i.unit_kg)});return`<tr><td><b>${items[0].order_no}</b></td><td>${items[0].tracking_no||"-"}</td><td>${items.map(i=>`<span class="tag">🍚 ${i.product_name} × ${i.qty}</span>`).join("")}</td><td>${p}</td><td><b>${k.toFixed(2)}</b></td></tr>`}).join("")+"</tbody></table>":"<div class='muted'>ยังไม่มีรายการ</div>"}q.oninput=render;clear.onclick=()=>{q.value="";render()};file.onchange=e=>e.target.files[0]&&importFile(e.target.files[0]);drop.ondragover=e=>{e.preventDefault();drop.classList.add("drag")};drop.ondragleave=()=>drop.classList.remove("drag");drop.ondrop=e=>{e.preventDefault();drop.classList.remove("drag");if(e.dataTransfer.files[0])importFile(e.dataTransfer.files[0])};load();</script></body></html>
